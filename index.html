<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Our Minecraft Love World ❤️</title>

    <!-- CSS -->

    <link rel="stylesheet"
          href="style.css">

    <!-- Minecraft Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

</head>

<body>

    <!-- ==========================
         Minecraft World
    =========================== -->

    <div id="minecraft-world">

        <!-- Sky -->

        <div class="sky"></div>

        <!-- Stars -->

        <div class="stars"></div>

        <!-- Moon -->

        <div class="moon"></div>

        <!-- Clouds -->

        <div class="cloud cloud1"></div>

        <div class="cloud cloud2"></div>

        <!-- Floating Hearts -->

        <div class="pixel-hearts"></div>

    </div>
        <!-- ==========================
         Main Container
    =========================== -->

    <div class="container">

        <!-- Minecraft Title -->

        <h1 class="minecraft-title">
            Our Minecraft Love World ❤️
        </h1>

        <p class="subtitle">
            Every block we place together becomes another memory.
        </p>

        <!-- Minecraft House -->

        <div class="house" id="house">

            <div class="roof"></div>

            <div class="chimney"></div>

            <div class="walls">

                <div class="window left-window"></div>

                <div class="window right-window"></div>

                <div class="door" id="door"></div>

                <div class="door-knob"></div>

            </div>

        </div>

        <!-- Campfire -->

        <div class="campfire">

            <div class="fire"></div>

            <div class="wood"></div>

        </div>

        <p class="click-text">
            ⛏️ Click the house to enter...
        </p>
                <!-- ==========================
             Minecraft Love Book
        =========================== -->

        <div class="book-page" id="bookPage">

            <div class="book">

                <div class="book-header">

                    <h2>📖 Dear Ali 🤍</h2>

                    <button id="closeBook" class="close-btn">
                        ✖
                    </button>

                </div>

                <div class="book-content">

                    <div id="typingText"></div>

                </div>

            </div>

        </div>

        <!-- ==========================
             Decorations
        =========================== -->

        <div class="diamond diamond-left">💎</div>

        <div class="diamond diamond-right">💎</div>

        <div class="emerald emerald-left">🟩</div>

        <div class="emerald emerald-right">🟩</div>

    </div>

    <!-- ==========================
         Footer
    =========================== -->

    <footer>

        <p>
            Built block by block with love ❤️
        </p>

    </footer>

    <!-- Background Music -->

    <audio id="bgMusic" loop>

        <source src="music.mp3" type="audio/mpeg">

    </audio>

    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
