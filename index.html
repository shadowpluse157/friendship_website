<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>For My Beautiful Ali 🤍</title>

    <!-- CSS -->

    <link rel="stylesheet"
          href="style.css">

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>
  <!-- Floating Hearts -->

<div class="hearts"></div>

<!-- Stars Background -->

<div class="stars"></div>

<!-- Main Container -->

<div class="container">

    <!-- Main Title -->

    <h1>
        To My Beautiful Ali 🤍
    </h1>

    <!-- Small Intro -->

    <p class="subtitle">

        Every line on this website was written
        with love, care and sincerity...

    </p>

    <!-- Envelope -->

    <div class="envelope">

        <div class="envelope-front">

            ❤️

        </div>

        <div class="envelope-back"></div>

    </div>

    <!-- Open Button -->

    <button id="openLetter">

        Open My Letter 💌

    </button>

</div>
<!-- Hidden Letter -->

<div class="letter-page">

    <div class="letter-content">

        <h2>Dear Ali 🤍</h2>

        <div id="typingText">

        </div>

    </div>

</div>

<!-- Bottom Quote -->

<div class="bottom-quote">

    <p>

        "Some people write letters...

        I built an entire website for you."

        ❤️

    </p>

</div>

<!-- Background Music (Optional) -->

<audio id="bgMusic" loop>

    <source src="assets/music.mp3" type="audio/mpeg">

</audio>

<!-- JavaScript -->

<script src="script.js"></script>

</body>

</html>
