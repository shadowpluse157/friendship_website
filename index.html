<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>For My Beautiful Ali 🤍</title>

<!-- CSS -->

<link rel="stylesheet" href="style.css">

<!-- Google Fonts -->

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<!-- Animated Background -->

<div id="background">

<div class="stars"></div>

<div class="twinkling-stars"></div>

<div class="moon"></div>

<div class="cloud cloud1"></div>

<div class="cloud cloud2"></div>

<div class="hearts"></div>

<div class="sparkles"></div>

</div>
  <!-- ==========================
     Main Glass Container
========================== -->

<div class="container">

    <!-- Main Title -->

    <h1 class="title">

        To My Beautiful Ali 🤍

    </h1>

    <!-- Subtitle -->

    <p class="subtitle">

        I didn't just write a letter...

        I built an entire world for you.

    </p>

    <!-- Decorative Line -->

    <div class="line"></div>

    <!-- Envelope -->

    <div class="envelope" id="envelope">

        <div class="envelope-shadow"></div>

        <div class="envelope-back"></div>

        <div class="envelope-paper">

            💌

        </div>

        <div class="envelope-front"></div>

        <div class="envelope-top"></div>

    </div>

    <!-- Open Button -->

    <button id="openLetter">

        Open My Heart ❤️

    </button>

</div>
  <!-- ==========================
     Hidden Love Letter
========================== -->

<div class="letter-page" id="letterPage">

    <div class="letter-card">

        <h2 class="letter-title">

            Dear Ali 🤍

        </h2>

        <div id="typingText">

        </div>

    </div>

</div>

<!-- ==========================
     Footer Quote
========================== -->

<footer>

    <p>

        Made with love,

        only for Ali ❤️

    </p>

</footer>

<!-- ==========================
     Background Music
========================== -->

<audio id="bgMusic" loop>

    <source src="music.mp3" type="audio/mpeg">

</audio>

<!-- ==========================
     JavaScript
========================== -->

<script src="script.js"></script>

</body>

</html>
