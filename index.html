<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Our Minecraft Love World ❤️</title>

    <!-- CSS -->

    <link rel="stylesheet" href="style.css">

    <!-- Minecraft Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
          rel="stylesheet">

</head>

<body>

<!-- Minecraft Background -->

<div id="minecraft-world">

    <!-- Sky -->

    <div class="sky"></div>

    <!-- Sun / Moon -->

    <div class="moon"></div>

    <!-- Clouds -->

    <div class="cloud cloud1"></div>

    <div class="cloud cloud2"></div>

    <!-- Floating Pixel Hearts -->

    <div class="pixel-hearts"></div>

</div>
  <!-- ==========================
     Minecraft Main Container
========================== -->

<div class="container">

    <!-- Minecraft Logo -->

    <h1 class="minecraft-title">

        OUR MINECRAFT LOVE WORLD ❤️

    </h1>

    <!-- Small Text -->

    <p class="subtitle">

        Two players...

        One beautiful world...

        One beautiful story.

    </p>

    <!-- Minecraft House -->

    <div class="house">

        <div class="roof"></div>

        <div class="walls">

            <div class="door"></div>

            <div class="window left-window"></div>

            <div class="window right-window"></div>

        </div>

    </div>

    <!-- Campfire -->

    <div class="campfire">

        <div class="fire"></div>

        <div class="wood"></div>

    </div>

    <!-- Grass -->

    <div class="grass"></div>

    <!-- Open Book Button -->

    <button id="openBook">

        Open Our Love Book 📖

    </button>

</div>
  <!-- ==========================
     Minecraft Love Book
========================== -->

<div class="book-page" id="bookPage">

    <div class="book">

        <div class="book-header">

            <h2>

                📖 Dear Ali 🤍

            </h2>

        </div>

        <div class="book-content">

            <div id="typingText">

            </div>

        </div>

    </div>

</div>

<!-- ==========================
     Minecraft Decorations
========================== -->

<div class="diamond diamond-left">💎</div>

<div class="diamond diamond-right">💎</div>

<div class="emerald emerald-left">🟩</div>

<div class="emerald emerald-right">🟩</div>

<!-- ==========================
     Footer
========================== -->

<footer>

    <p>

        Built block by block with love ❤️

    </p>

</footer>

<!-- ==========================
     Background Music
========================== -->

<audio id="bgMusic" loop>

    <source src="music.mp3" type="audio/mpeg">

</audio>

<!-- ==========================
     JavaScript
========================== -->

<script src="script.js"></script>

</body>

</html>
